<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1612" width="100%" height="auto" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

  <defs>
    <filter id="card-shadow" x="-5%" y="-10%" width="110%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.08" />
    </filter>
    <linearGradient id="spine-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0969da" />
      <stop offset="30%" stop-color="#8250df" />
      <stop offset="60%" stop-color="#d97706" />
      <stop offset="85%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" rx="12" />

  <!-- Header -->
  <g text-anchor="middle">
    <rect x="380" y="20" width="240" height="26" rx="13" fill="#ddf4ff" stroke="#54aeff" stroke-width="1" />
    <text x="500" y="37" font-size="12" font-weight="700" fill="#0969da">LINHA DO TEMPO</text>
    <text x="500" y="74" font-size="24" font-weight="700" fill="#1f2328">A Evolução do Unix e Linux</text>
    <text x="500" y="98" font-size="14" fill="#656d76">Dos laboratórios Bell Labs à espinha dorsal da nuvem, mobilidade e supercomputação</text>
  </g>

  <!-- Spine -->
  <line x1="500" y1="110" x2="500" y2="1511" stroke="url(#spine-grad)" stroke-width="4" stroke-linecap="round" />
  <line x1="455" y1="176" x2="486" y2="176" stroke="#0969da" stroke-width="2.5" stroke-dasharray="5 3" />
  <!-- Node 0 -->
  <circle cx="500" cy="176" r="13" fill="#ffffff" stroke="#0969da" stroke-width="4" />
  <circle cx="500" cy="176" r="5" fill="#0969da" />

  <!-- Card 0: 1969 -->
  <g filter="url(#card-shadow)">
    <rect x="35" y="125" width="420" height="102" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
    <rect x="35" y="125" width="420" height="102" rx="10" fill="none" stroke="#0969da" stroke-width="1.5" stroke-opacity="0.4" />
    <line x1="35" y1="135" x2="35" y2="217" stroke="#0969da" stroke-width="4" stroke-linecap="round" />
  </g>

    <rect x="57" y="139" width="66" height="22" rx="4" fill="#0969da" />
    <text x="90" y="154" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1969</text>
    <text x="133" y="154" font-size="11" font-weight="700" fill="#0969da">BELL LABS / AT&amp;T</text>
    <text x="57" y="182" font-size="15" font-weight="700" fill="#1f2328">Criação do Unix</text>
    <text x="57" y="201" font-size="12" fill="#57606a">Ken Thompson e Dennis Ritchie desenvolvem a</text>
    <text x="57" y="217" font-size="12" fill="#57606a">primeira versão do Unix nos Bell Labs.</text>
  <line x1="514" y1="308" x2="545" y2="308" stroke="#0969da" stroke-width="2.5" stroke-dasharray="5 3" />
  <!-- Node 1 -->
  <circle cx="500" cy="308" r="13" fill="#ffffff" stroke="#0969da" stroke-width="4" />
  <circle cx="500" cy="308" r="5" fill="#0969da" />

  <!-- Card 1: 1973 -->
  <g filter="url(#card-shadow)">
    <rect x="545" y="257" width="420" height="102" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
    <rect x="545" y="257" width="420" height="102" rx="10" fill="none" stroke="#0969da" stroke-width="1.5" stroke-opacity="0.4" />
    <line x1="545" y1="267" x2="545" y2="349" stroke="#0969da" stroke-width="4" stroke-linecap="round" />
  </g>

    <rect x="567" y="271" width="66" height="22" rx="4" fill="#0969da" />
    <text x="600" y="286" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1973</text>
    <text x="643" y="286" font-size="11" font-weight="700" fill="#0969da">PORTABILIDADE</text>
    <text x="567" y="314" font-size="15" font-weight="700" fill="#1f2328">Reescrita na Linguagem C</text>
    <text x="567" y="333" font-size="12" fill="#57606a">O Unix é reescrito em C, tornando-se o primeiro SO</text>
    <text x="567" y="349" font-size="12" fill="#57606a">verdadeiramente portátil.</text>
  <line x1="455" y1="440" x2="486" y2="440" stroke="#1f6feb" stroke-width="2.5" stroke-dasharray="5 3" />
  <!-- Node 2 -->
  <circle cx="500" cy="440" r="13" fill="#ffffff" stroke="#1f6feb" stroke-width="4" />
  <circle cx="500" cy="440" r="5" fill="#1f6feb" />

  <!-- Card 2: 1977 -->
  <g filter="url(#card-shadow)">
    <rect x="35" y="389" width="420" height="102" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
    <rect x="35" y="389" width="420" height="102" rx="10" fill="none" stroke="#1f6feb" stroke-width="1.5" stroke-opacity="0.4" />
    <line x1="35" y1="399" x2="35" y2="481" stroke="#1f6feb" stroke-width="4" stroke-linecap="round" />
  </g>

    <rect x="57" y="403" width="66" height="22" rx="4" fill="#1f6feb" />
    <text x="90" y="418" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1977</text>
    <text x="133" y="418" font-size="11" font-weight="700" fill="#1f6feb">ACADEMIA &amp; REDES</text>
    <text x="57" y="446" font-size="15" font-weight="700" fill="#1f2328">Nascimento do BSD</text>
    <text x="57" y="465" font-size="12" fill="#57606a">Universidade de Berkeley lança o BSD, pioneiro na</text>
    <text x="57" y="481" font-size="12" fill="#57606a">implementação da pilha TCP/IP.</text>
  <line x1="514" y1="572" x2="545" y2="572" stroke="#8250df" stroke-width="2.5" stroke-dasharray="5 3" />
  <!-- Node 3 -->
  <circle cx="500" cy="572" r="13" fill="#ffffff" stroke="#8250df" stroke-width="4" />
  <circle cx="500" cy="572" r="5" fill="#8250df" />

  <!-- Card 3: 1983 -->
  <g filter="url(#card-shadow)">
    <rect x="545" y="521" width="420" height="102" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
    <rect x="545" y="521" width="420" height="102" rx="10" fill="none" stroke="#8250df" stroke-width="1.5" stroke-opacity="0.4" />
    <line x1="545" y1="531" x2="545" y2="613" stroke="#8250df" stroke-width="4" stroke-linecap="round" />
  </g>

    <rect x="567" y="535" width="66" height="22" rx="4" fill="#8250df" />
    <text x="600" y="550" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1983</text>
    <text x="643" y="550" font-size="11" font-weight="700" fill="#8250df">SOFTWARE LIVRE</text>
    <text x="567" y="578" font-size="15" font-weight="700" fill="#1f2328">Lançamento do Projeto GNU</text>
    <text x="567" y="597" font-size="12" fill="#57606a">Richard Stallman funda a FSF para criar um SO 100%</text>
    <text x="567" y="613" font-size="12" fill="#57606a">livre e compatível com Unix.</text>
  <line x1="455" y1="704" x2="486" y2="704" stroke="#d97706" stroke-width="2.5" stroke-dasharray="5 3" />
  <!-- Node 4 -->
  <circle cx="500" cy="704" r="13" fill="#ffffff" stroke="#d97706" stroke-width="4" />
  <circle cx="500" cy="704" r="5" fill="#d97706" />

  <!-- Card 4: 1991 -->
  <g filter="url(#card-shadow)">
    <rect x="35" y="653" width="420" height="102" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
    <rect x="35" y="653" width="420" height="102" rx="10" fill="none" stroke="#d97706" stroke-width="1.5" stroke-opacity="0.4" />
    <line x1="35" y1="663" x2="35" y2="745" stroke="#d97706" stroke-width="4" stroke-linecap="round" />
  </g>

    <rect x="57" y="667" width="66" height="22" rx="4" fill="#d97706" />
    <text x="90" y="682" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1991</text>
    <text x="133" y="682" font-size="11" font-weight="700" fill="#d97706">HELSINKI / X86</text>
    <text x="57" y="710" font-size="15" font-weight="700" fill="#1f2328">Anúncio do Kernel Linux</text>
    <text x="57" y="729" font-size="12" fill="#57606a">Linus Torvalds, aos 21 anos, cria e disponibiliza a</text>
    <text x="57" y="745" font-size="12" fill="#57606a">versão 0.01 por hobby para PCs x86.</text>
  <line x1="514" y1="836" x2="545" y2="836" stroke="#d97706" stroke-width="2.5" stroke-dasharray="5 3" />
  <!-- Node 5 -->
  <circle cx="500" cy="836" r="13" fill="#ffffff" stroke="#d97706" stroke-width="4" />
  <circle cx="500" cy="836" r="5" fill="#d97706" />

  <!-- Card 5: 1992 -->
  <g filter="url(#card-shadow)">
    <rect x="545" y="785" width="420" height="102" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
    <rect x="545" y="785" width="420" height="102" rx="10" fill="none" stroke="#d97706" stroke-width="1.5" stroke-opacity="0.4" />
    <line x1="545" y1="795" x2="545" y2="877" stroke="#d97706" stroke-width="4" stroke-linecap="round" />
  </g>

    <rect x="567" y="799" width="66" height="22" rx="4" fill="#d97706" />
    <text x="600" y="814" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1992</text>
    <text x="643" y="814" font-size="11" font-weight="700" fill="#d97706">GNU/LINUX</text>
    <text x="567" y="842" font-size="15" font-weight="700" fill="#1f2328">Adoção da Licença GPL v2</text>
    <text x="567" y="861" font-size="12" fill="#57606a">O Linux passa a usar a GNU GPL, integrando-se</text>
    <text x="567" y="877" font-size="12" fill="#57606a">formalmente aos utilitários GNU.</text>
  <line x1="455" y1="968" x2="486" y2="968" stroke="#2da44e" stroke-width="2.5" stroke-dasharray="5 3" />
  <!-- Node 6 -->
  <circle cx="500" cy="968" r="13" fill="#ffffff" stroke="#2da44e" stroke-width="4" />
  <circle cx="500" cy="968" r="5" fill="#2da44e" />

  <!-- Card 6: 1993-94 -->
  <g filter="url(#card-shadow)">
    <rect x="35" y="917" width="420" height="102" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
    <rect x="35" y="917" width="420" height="102" rx="10" fill="none" stroke="#2da44e" stroke-width="1.5" stroke-opacity="0.4" />
    <line x1="35" y1="927" x2="35" y2="1009" stroke="#2da44e" stroke-width="4" stroke-linecap="round" />
  </g>

    <rect x="57" y="931" width="97" height="22" rx="4" fill="#2da44e" />
    <text x="105" y="946" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1993-94</text>
    <text x="164" y="946" font-size="11" font-weight="700" fill="#2da44e">DISTRIBUIÇÕES</text>
    <text x="57" y="974" font-size="15" font-weight="700" fill="#1f2328">Distribuições Pioneiras</text>
    <text x="57" y="993" font-size="12" fill="#57606a">Surgem Slackware, Debian e Red Hat, estruturando a</text>
    <text x="57" y="1009" font-size="12" fill="#57606a">distribuição pública do Linux.</text>
  <line x1="514" y1="1100" x2="545" y2="1100" stroke="#2da44e" stroke-width="2.5" stroke-dasharray="5 3" />
  <!-- Node 7 -->
  <circle cx="500" cy="1100" r="13" fill="#ffffff" stroke="#2da44e" stroke-width="4" />
  <circle cx="500" cy="1100" r="5" fill="#2da44e" />

  <!-- Card 7: 1996 -->
  <g filter="url(#card-shadow)">
    <rect x="545" y="1049" width="420" height="102" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
    <rect x="545" y="1049" width="420" height="102" rx="10" fill="none" stroke="#2da44e" stroke-width="1.5" stroke-opacity="0.4" />
    <line x1="545" y1="1059" x2="545" y2="1141" stroke="#2da44e" stroke-width="4" stroke-linecap="round" />
  </g>

    <rect x="567" y="1063" width="66" height="22" rx="4" fill="#2da44e" />
    <text x="600" y="1078" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1996</text>
    <text x="643" y="1078" font-size="11" font-weight="700" fill="#2da44e">TUX &amp; SMP</text>
    <text x="567" y="1106" font-size="15" font-weight="700" fill="#1f2328">Kernel 2.0 e o Mascote Tux</text>
    <text x="567" y="1125" font-size="12" fill="#57606a">Adoção do mascote oficial Tux e introdução de</text>
    <text x="567" y="1141" font-size="12" fill="#57606a">suporte a multiprocessamento (SMP).</text>
  <line x1="455" y1="1232" x2="486" y2="1232" stroke="#e05624" stroke-width="2.5" stroke-dasharray="5 3" />
  <!-- Node 8 -->
  <circle cx="500" cy="1232" r="13" fill="#ffffff" stroke="#e05624" stroke-width="4" />
  <circle cx="500" cy="1232" r="5" fill="#e05624" />

  <!-- Card 8: 2004 -->
  <g filter="url(#card-shadow)">
    <rect x="35" y="1181" width="420" height="102" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
    <rect x="35" y="1181" width="420" height="102" rx="10" fill="none" stroke="#e05624" stroke-width="1.5" stroke-opacity="0.4" />
    <line x1="35" y1="1191" x2="35" y2="1273" stroke="#e05624" stroke-width="4" stroke-linecap="round" />
  </g>

    <rect x="57" y="1195" width="66" height="22" rx="4" fill="#e05624" />
    <text x="90" y="1210" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2004</text>
    <text x="133" y="1210" font-size="11" font-weight="700" fill="#e05624">DESKTOP LINUX</text>
    <text x="57" y="1238" font-size="15" font-weight="700" fill="#1f2328">Lançamento do Ubuntu</text>
    <text x="57" y="1257" font-size="12" fill="#57606a">Canonical lança o Ubuntu, revolucionando a</text>
    <text x="57" y="1273" font-size="12" fill="#57606a">facilidade de uso do Linux no desktop.</text>
  <line x1="514" y1="1364" x2="545" y2="1364" stroke="#10b981" stroke-width="2.5" stroke-dasharray="5 3" />
  <!-- Node 9 -->
  <circle cx="500" cy="1364" r="13" fill="#ffffff" stroke="#10b981" stroke-width="4" />
  <circle cx="500" cy="1364" r="5" fill="#10b981" />

  <!-- Card 9: 2008 -->
  <g filter="url(#card-shadow)">
    <rect x="545" y="1313" width="420" height="102" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
    <rect x="545" y="1313" width="420" height="102" rx="10" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4" />
    <line x1="545" y1="1323" x2="545" y2="1405" stroke="#10b981" stroke-width="4" stroke-linecap="round" />
  </g>

    <rect x="567" y="1327" width="66" height="22" rx="4" fill="#10b981" />
    <text x="600" y="1342" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2008</text>
    <text x="643" y="1342" font-size="11" font-weight="700" fill="#10b981">MOBILE / GOOGLE</text>
    <text x="567" y="1370" font-size="15" font-weight="700" fill="#1f2328">Lançamento do Android</text>
    <text x="567" y="1389" font-size="12" fill="#57606a">Google lança o Android sobre o kernel Linux,</text>
    <text x="567" y="1405" font-size="12" fill="#57606a">transformando a computação móvel global.</text>
  <line x1="455" y1="1496" x2="486" y2="1496" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="5 3" />
  <!-- Node 10 -->
  <circle cx="500" cy="1496" r="13" fill="#ffffff" stroke="#2563eb" stroke-width="4" />
  <circle cx="500" cy="1496" r="5" fill="#2563eb" />

  <!-- Card 10: 2013+ -->
  <g filter="url(#card-shadow)">
    <rect x="35" y="1445" width="420" height="102" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
    <rect x="35" y="1445" width="420" height="102" rx="10" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-opacity="0.4" />
    <line x1="35" y1="1455" x2="35" y2="1537" stroke="#2563eb" stroke-width="4" stroke-linecap="round" />
  </g>

    <rect x="57" y="1459" width="75" height="22" rx="4" fill="#2563eb" />
    <text x="94" y="1474" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2013+</text>
    <text x="142" y="1474" font-size="11" font-weight="700" fill="#2563eb">CLOUD &amp; DEVOPS</text>
    <text x="57" y="1502" font-size="15" font-weight="700" fill="#1f2328">Era dos Containers e Nuvem</text>
    <text x="57" y="1521" font-size="12" fill="#57606a">Docker e Kubernetes consolidam o Linux como a base</text>
    <text x="57" y="1537" font-size="12" fill="#57606a">mundial de nuvem e supercomputação.</text>
</svg>