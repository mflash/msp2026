<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 270" width="100%" height="auto" font-family="'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <!-- Card Shadow -->
    <filter id="shadow" x="-8%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <!-- Node Glow Filters -->
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#38bdf8" flood-opacity="0.6" />
    </filter>
    <filter id="glow-yellow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#ffe600" flood-opacity="0.6" />
    </filter>
    <filter id="glow-orange" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#f7941d" flood-opacity="0.6" />
    </filter>
    <filter id="glow-gold" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ffe600" flood-opacity="0.8" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="55%" stop-color="#ffe600" />
      <stop offset="80%" stop-color="#f7941d" />
      <stop offset="100%" stop-color="#ffe600" />
    </linearGradient>

    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe600" />
      <stop offset="100%" stop-color="#f7941d" />
    </linearGradient>
  </defs>

  <!-- Horizontal Timeline Connecting Line -->
  <path d="M 112 80 L 1008 80" stroke="url(#line-grad)" stroke-width="4" stroke-linecap="round" />
  
  <!-- Dashed aura line -->
  <path d="M 112 80 L 1008 80" stroke="rgba(255, 255, 255, 0.25)" stroke-width="8" stroke-dasharray="2 10" stroke-linecap="round" />

  <!-- ==================== STAGE 1: 1969 UNIX ==================== -->
  <g transform="translate(112, 0)">
    <!-- Year Badge -->
    <rect x="-38" y="22" width="76" height="24" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <text x="0" y="38" text-anchor="middle" font-size="12" font-weight="800" fill="#38bdf8" letter-spacing="0.5">1969</text>

    <!-- Node Circle -->
    <circle cx="0" cy="80" r="20" fill="#0f172a" stroke="#38bdf8" stroke-width="3" filter="url(#glow-cyan)" />
    <!-- Terminal Icon -->
    <text x="0" y="86" text-anchor="middle" font-size="15" fill="#38bdf8">🐚</text>

    <!-- Card -->
    <g transform="translate(-100, 118)">
      <rect x="0" y="0" width="200" height="126" rx="10" fill="#0f172a" fill-opacity="0.88" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.2" filter="url(#shadow)" />
      <rect x="0" y="0" width="200" height="4" rx="2" fill="#38bdf8" />
      <text x="14" y="28" font-size="14" font-weight="800" fill="#38bdf8">Unix (Bell Labs)</text>
      <text x="14" y="52" font-size="11" font-weight="600" fill="#ffffff">Ken Thompson &amp;</text>
      <text x="14" y="68" font-size="11" font-weight="600" fill="#ffffff">Dennis Ritchie</text>
      <text x="14" y="92" font-size="10.5" fill="#cbd5e1">Sistemas modulares,</text>
      <text x="14" y="108" font-size="10.5" fill="#cbd5e1">ferramentas e pipes.</text>
    </g>
  </g>

  <!-- ==================== STAGE 2: 1973 LINGUAGEM C ==================== -->
  <g transform="translate(336, 0)">
    <!-- Year Badge -->
    <rect x="-38" y="22" width="76" height="24" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <text x="0" y="38" text-anchor="middle" font-size="12" font-weight="800" fill="#38bdf8" letter-spacing="0.5">1973</text>

    <!-- Node Circle -->
    <circle cx="0" cy="80" r="20" fill="#0f172a" stroke="#38bdf8" stroke-width="3" filter="url(#glow-cyan)" />
    <!-- C Icon -->
    <text x="0" y="86" text-anchor="middle" font-size="14" font-weight="900" fill="#38bdf8" font-family="'Fira Code', monospace">{C}</text>

    <!-- Card -->
    <g transform="translate(-100, 118)">
      <rect x="0" y="0" width="200" height="126" rx="10" fill="#0f172a" fill-opacity="0.88" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.2" filter="url(#shadow)" />
      <rect x="0" y="0" width="200" height="4" rx="2" fill="#38bdf8" />
      <text x="14" y="28" font-size="14" font-weight="800" fill="#38bdf8">Reescrita em C</text>
      <text x="14" y="52" font-size="11" font-weight="600" fill="#ffffff">Revolução da</text>
      <text x="14" y="68" font-size="11" font-weight="600" fill="#ffffff">Portabilidade</text>
      <text x="14" y="92" font-size="10.5" fill="#cbd5e1">1º SO a rodar em</text>
      <text x="14" y="108" font-size="10.5" fill="#cbd5e1">múltiplos processadores.</text>
    </g>
  </g>

  <!-- ==================== STAGE 3: 1983 PROJETO GNU ==================== -->
  <g transform="translate(560, 0)">
    <!-- Year Badge -->
    <rect x="-38" y="22" width="76" height="24" rx="12" fill="#0f172a" stroke="#ffe600" stroke-width="1.5" />
    <text x="0" y="38" text-anchor="middle" font-size="12" font-weight="800" fill="#ffe600" letter-spacing="0.5">1983</text>

    <!-- Node Circle -->
    <circle cx="0" cy="80" r="20" fill="#0f172a" stroke="#ffe600" stroke-width="3" filter="url(#glow-yellow)" />
    <!-- Free Software Icon -->
    <text x="0" y="86" text-anchor="middle" font-size="14" fill="#ffe600">⚖️</text>

    <!-- Card -->
    <g transform="translate(-100, 118)">
      <rect x="0" y="0" width="200" height="126" rx="10" fill="#0f172a" fill-opacity="0.88" stroke="rgba(255, 230, 0, 0.4)" stroke-width="1.2" filter="url(#shadow)" />
      <rect x="0" y="0" width="200" height="4" rx="2" fill="#ffe600" />
      <text x="14" y="28" font-size="14" font-weight="800" fill="#ffe600">Projeto GNU</text>
      <text x="14" y="52" font-size="11" font-weight="600" fill="#ffffff">Richard Stallman</text>
      <text x="14" y="68" font-size="11" font-weight="600" fill="#ffffff">&amp; Free Software</text>
      <text x="14" y="92" font-size="10.5" fill="#cbd5e1">Compiladores (GCC) e</text>
      <text x="14" y="108" font-size="10.5" fill="#fca311">ferramentas (sem kernel).</text>
    </g>
  </g>

  <!-- ==================== STAGE 4: 1991 LINUX ==================== -->
  <g transform="translate(784, 0)">
    <!-- Year Badge -->
    <rect x="-38" y="22" width="76" height="24" rx="12" fill="#0f172a" stroke="#f7941d" stroke-width="1.5" />
    <text x="0" y="38" text-anchor="middle" font-size="12" font-weight="800" fill="#f7941d" letter-spacing="0.5">1991</text>

    <!-- Node Circle -->
    <circle cx="0" cy="80" r="20" fill="#0f172a" stroke="#f7941d" stroke-width="3" filter="url(#glow-orange)" />
    <!-- Penguin Icon -->
    <text x="0" y="86" text-anchor="middle" font-size="15" fill="#f7941d">🐧</text>

    <!-- Card -->
    <g transform="translate(-100, 118)">
      <rect x="0" y="0" width="200" height="126" rx="10" fill="#0f172a" fill-opacity="0.88" stroke="rgba(247, 148, 29, 0.4)" stroke-width="1.2" filter="url(#shadow)" />
      <rect x="0" y="0" width="200" height="4" rx="2" fill="#f7941d" />
      <text x="14" y="28" font-size="14" font-weight="800" fill="#f7941d">Kernel Linux</text>
      <text x="14" y="52" font-size="11" font-weight="600" fill="#ffffff">Linus Torvalds</text>
      <text x="14" y="68" font-size="11" font-weight="600" fill="#ffffff">(Helsinki, Finlândia)</text>
      <text x="14" y="92" font-size="10.5" fill="#cbd5e1">O núcleo livre sob</text>
      <text x="14" y="108" font-size="10.5" fill="#cbd5e1">licença GNU GPL.</text>
    </g>
  </g>

  <!-- ==================== STAGE 5: HOJE ==================== -->
  <g transform="translate(1008, 0)">
    <!-- Year Badge -->
    <rect x="-38" y="22" width="76" height="24" rx="12" fill="url(#gold-grad)" />
    <text x="0" y="38" text-anchor="middle" font-size="12" font-weight="900" fill="#0f172a" letter-spacing="0.8">HOJE</text>

    <!-- Node Circle -->
    <circle cx="0" cy="80" r="22" fill="#0f172a" stroke="#ffe600" stroke-width="3.5" filter="url(#glow-gold)" />
    <!-- Rocket / Globe Icon -->
    <text x="0" y="87" text-anchor="middle" font-size="16" fill="#ffe600">🚀</text>

    <!-- Card (Highlighted) -->
    <g transform="translate(-100, 118)">
      <rect x="0" y="0" width="200" height="126" rx="10" fill="#0f172a" fill-opacity="0.95" stroke="#ffe600" stroke-width="1.5" filter="url(#shadow)" />
      <rect x="0" y="0" width="200" height="5" rx="2" fill="url(#gold-grad)" />
      <text x="14" y="28" font-size="14" font-weight="900" fill="#ffe600">GNU/Linux</text>
      <text x="14" y="52" font-size="11" font-weight="700" fill="#ffffff">A União Perfeita</text>
      <text x="14" y="68" font-size="11" font-weight="600" fill="#38bdf8">GNU + Linux</text>
      <text x="14" y="92" font-size="10.5" fill="#ffffff">100% Supercomputadores</text>
      <text x="14" y="108" font-size="10.5" fill="#ffe600">Nuvem, IoT e Android.</text>
    </g>
  </g>
</svg>
