<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 380" width="100%" height="auto" font-family="'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <!-- Card Shadow -->
    <filter id="shadow" x="-8%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <!-- Node Glow Filters -->
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#38bdf8" flood-opacity="0.75" />
    </filter>
    <filter id="glow-yellow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#ffe600" flood-opacity="0.75" />
    </filter>
    <filter id="glow-orange" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#f7941d" flood-opacity="0.75" />
    </filter>
    <filter id="glow-gold" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#ffe600" flood-opacity="0.9" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="55%" stop-color="#ffe600" />
      <stop offset="78%" stop-color="#f7941d" />
      <stop offset="100%" stop-color="#ffe600" />
    </linearGradient>

    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe600" />
      <stop offset="100%" stop-color="#f7941d" />
    </linearGradient>
  </defs>

  <!-- Horizontal Timeline Connecting Line -->
  <path d="M 114 95 L 1026 95" stroke="url(#line-grad)" stroke-width="5" stroke-linecap="round" />
  
  <!-- Dashed aura line -->
  <path d="M 114 95 L 1026 95" stroke="rgba(255, 255, 255, 0.25)" stroke-width="11" stroke-dasharray="3 14" stroke-linecap="round" />

  <!-- ==================== STAGE 1: 1969 UNIX ==================== -->
  <g transform="translate(114, 0)">
    <!-- Year Badge -->
    <rect x="-46" y="22" width="92" height="30" rx="15" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <text x="0" y="42" text-anchor="middle" font-size="15" font-weight="800" fill="#38bdf8" letter-spacing="0.5">1969</text>

    <!-- Node Circle -->
    <circle cx="0" cy="95" r="28" fill="#0f172a" stroke="#38bdf8" stroke-width="3.5" filter="url(#glow-cyan)" />
    <!-- Terminal Icon -->
    <text x="0" y="103" text-anchor="middle" font-size="22" fill="#38bdf8">🐚</text>

    <!-- Card -->
    <g transform="translate(-108, 142)">
      <rect x="0" y="0" width="216" height="215" rx="12" fill="#0f172a" fill-opacity="0.92" stroke="rgba(56, 189, 248, 0.45)" stroke-width="1.5" filter="url(#shadow)" />
      <rect x="0" y="0" width="216" height="5" rx="2" fill="#38bdf8" />
      <text x="16" y="34" font-size="17" font-weight="800" fill="#38bdf8">Unix (Bell Labs)</text>
      
      <text x="16" y="62" font-size="13.5" font-weight="700" fill="#ffffff">Ken Thompson &amp;</text>
      <text x="16" y="82" font-size="13.5" font-weight="700" fill="#ffffff">Dennis Ritchie</text>
      
      <line x1="16" y1="98" x2="200" y2="98" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      
      <text x="16" y="126" font-size="12.5" fill="#cbd5e1">• Arquitetura simples</text>
      <text x="16" y="148" font-size="12.5" fill="#cbd5e1">• Ferramentas modulares</text>
      <text x="16" y="170" font-size="12.5" fill="#cbd5e1">• Canais de pipes (<tspan font-family="'Fira Code', monospace" fill="#38bdf8">|</tspan>)</text>
      <text x="16" y="194" font-size="12" font-weight="600" fill="#38bdf8">Base de tudo moderno</text>
    </g>
  </g>

  <!-- ==================== STAGE 2: 1973 LINGUAGEM C ==================== -->
  <g transform="translate(342, 0)">
    <!-- Year Badge -->
    <rect x="-46" y="22" width="92" height="30" rx="15" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <text x="0" y="42" text-anchor="middle" font-size="15" font-weight="800" fill="#38bdf8" letter-spacing="0.5">1973</text>

    <!-- Node Circle -->
    <circle cx="0" cy="95" r="28" fill="#0f172a" stroke="#38bdf8" stroke-width="3.5" filter="url(#glow-cyan)" />
    <!-- C Icon -->
    <text x="0" y="103" text-anchor="middle" font-size="19" font-weight="900" fill="#38bdf8" font-family="'Fira Code', monospace">{C}</text>

    <!-- Card -->
    <g transform="translate(-108, 142)">
      <rect x="0" y="0" width="216" height="215" rx="12" fill="#0f172a" fill-opacity="0.92" stroke="rgba(56, 189, 248, 0.45)" stroke-width="1.5" filter="url(#shadow)" />
      <rect x="0" y="0" width="216" height="5" rx="2" fill="#38bdf8" />
      <text x="16" y="34" font-size="17" font-weight="800" fill="#38bdf8">Reescrita em C</text>
      
      <text x="16" y="62" font-size="13.5" font-weight="700" fill="#ffffff">A Revolução da</text>
      <text x="16" y="82" font-size="13.5" font-weight="700" fill="#ffffff">Portabilidade</text>
      
      <line x1="16" y1="98" x2="200" y2="98" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      
      <text x="16" y="126" font-size="12.5" fill="#cbd5e1">• Dennis Ritchie cria o C</text>
      <text x="16" y="148" font-size="12.5" fill="#cbd5e1">• Fim do Assembly fixo</text>
      <text x="16" y="170" font-size="12.5" fill="#cbd5e1">• 1º SO portável</text>
      <text x="16" y="194" font-size="12" font-weight="600" fill="#38bdf8">Multi-plataforma</text>
    </g>
  </g>

  <!-- ==================== STAGE 3: 1983 PROJETO GNU ==================== -->
  <g transform="translate(570, 0)">
    <!-- Year Badge -->
    <rect x="-46" y="22" width="92" height="30" rx="15" fill="#0f172a" stroke="#ffe600" stroke-width="2" />
    <text x="0" y="42" text-anchor="middle" font-size="15" font-weight="800" fill="#ffe600" letter-spacing="0.5">1983</text>

    <!-- Node Circle -->
    <circle cx="0" cy="95" r="28" fill="#0f172a" stroke="#ffe600" stroke-width="3.5" filter="url(#glow-yellow)" />
    <!-- Free Software Icon -->
    <text x="0" y="103" text-anchor="middle" font-size="20" fill="#ffe600">⚖️</text>

    <!-- Card -->
    <g transform="translate(-108, 142)">
      <rect x="0" y="0" width="216" height="215" rx="12" fill="#0f172a" fill-opacity="0.92" stroke="rgba(255, 230, 0, 0.45)" stroke-width="1.5" filter="url(#shadow)" />
      <rect x="0" y="0" width="216" height="5" rx="2" fill="#ffe600" />
      <text x="16" y="34" font-size="17" font-weight="800" fill="#ffe600">Projeto GNU</text>
      
      <text x="16" y="62" font-size="13.5" font-weight="700" fill="#ffffff">Richard Stallman</text>
      <text x="16" y="82" font-size="13.5" font-weight="700" fill="#ffffff">&amp; Software Livre</text>
      
      <line x1="16" y1="98" x2="200" y2="98" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      
      <text x="16" y="126" font-size="12.5" fill="#cbd5e1">• Licença GNU GPL</text>
      <text x="16" y="148" font-size="12.5" fill="#cbd5e1">• Compilador GCC</text>
      <text x="16" y="170" font-size="12.5" fill="#cbd5e1">• Coreutils e Bash</text>
      <text x="16" y="194" font-size="12" font-weight="700" fill="#fca311">⚠️ Faltava o Kernel!</text>
    </g>
  </g>

  <!-- ==================== STAGE 4: 1991 LINUX ==================== -->
  <g transform="translate(798, 0)">
    <!-- Year Badge -->
    <rect x="-46" y="22" width="92" height="30" rx="15" fill="#0f172a" stroke="#f7941d" stroke-width="2" />
    <text x="0" y="42" text-anchor="middle" font-size="15" font-weight="800" fill="#f7941d" letter-spacing="0.5">1991</text>

    <!-- Node Circle -->
    <circle cx="0" cy="95" r="28" fill="#0f172a" stroke="#f7941d" stroke-width="3.5" filter="url(#glow-orange)" />
    <!-- Penguin Icon -->
    <text x="0" y="103" text-anchor="middle" font-size="22" fill="#f7941d">🐧</text>

    <!-- Card -->
    <g transform="translate(-108, 142)">
      <rect x="0" y="0" width="216" height="215" rx="12" fill="#0f172a" fill-opacity="0.92" stroke="rgba(247, 148, 29, 0.45)" stroke-width="1.5" filter="url(#shadow)" />
      <rect x="0" y="0" width="216" height="5" rx="2" fill="#f7941d" />
      <text x="16" y="34" font-size="17" font-weight="800" fill="#f7941d">Kernel Linux</text>
      
      <text x="16" y="62" font-size="13.5" font-weight="700" fill="#ffffff">Linus Torvalds</text>
      <text x="16" y="82" font-size="13.5" font-weight="700" fill="#ffffff">(Helsinki, Finlândia)</text>
      
      <line x1="16" y1="98" x2="200" y2="98" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      
      <text x="16" y="126" font-size="12.5" fill="#cbd5e1">• Criado como hobby</text>
      <text x="16" y="148" font-size="12.5" fill="#cbd5e1">• Monolítico e rápido</text>
      <text x="16" y="170" font-size="12.5" fill="#cbd5e1">• Aberto com licença GPL</text>
      <text x="16" y="194" font-size="12" font-weight="600" fill="#f7941d">O elo que faltava</text>
    </g>
  </g>

  <!-- ==================== STAGE 5: HOJE ==================== -->
  <g transform="translate(1026, 0)">
    <!-- Year Badge -->
    <rect x="-46" y="22" width="92" height="30" rx="15" fill="url(#gold-grad)" />
    <text x="0" y="42" text-anchor="middle" font-size="15" font-weight="900" fill="#0f172a" letter-spacing="0.8">HOJE</text>

    <!-- Node Circle -->
    <circle cx="0" cy="95" r="30" fill="#0f172a" stroke="#ffe600" stroke-width="4" filter="url(#glow-gold)" />
    <!-- Rocket / Globe Icon -->
    <text x="0" y="104" text-anchor="middle" font-size="22" fill="#ffe600">🚀</text>

    <!-- Card (Highlighted) -->
    <g transform="translate(-108, 142)">
      <rect x="0" y="0" width="216" height="215" rx="12" fill="#0f172a" fill-opacity="0.96" stroke="#ffe600" stroke-width="2" filter="url(#shadow)" />
      <rect x="0" y="0" width="216" height="6" rx="2" fill="url(#gold-grad)" />
      <text x="16" y="34" font-size="17" font-weight="900" fill="#ffe600">GNU/Linux</text>
      
      <text x="16" y="62" font-size="13.5" font-weight="800" fill="#ffffff">A União Perfeita</text>
      <text x="16" y="82" font-size="13.5" font-weight="700" fill="#38bdf8">GNU + Linux</text>
      
      <line x1="16" y1="98" x2="200" y2="98" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      
      <text x="16" y="126" font-size="12.5" font-weight="700" fill="#ffffff">100% Supercomput.</text>
      <text x="16" y="148" font-size="12.5" fill="#cbd5e1">• Nuvem e Servidores</text>
      <text x="16" y="170" font-size="12.5" fill="#cbd5e1">• Android, IoT e Marte</text>
      <text x="16" y="194" font-size="12" font-weight="800" fill="#ffe600">O padrão da indústria</text>
    </g>
  </g>
</svg>
