<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #1e293b; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #64748b; }
      .section-hdr { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; }
      .box-label { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; }
      .text-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #64748b; }
      .code-mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; font-weight: 700; }
      .code-sm { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b" />
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb" />
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#d97706" />
    </marker>
  </defs>

  <!-- Background Card -->
  <rect width="960" height="540" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Header -->
  <text x="32" y="40" class="title">Ciclo de Vida, Estados e Sinais de Processos no Linux</text>
  <text x="32" y="60" class="subtitle">Como o sistema operacional instancia, gerencia, pausa e encerra programas</text>

  <!-- ======================================================== -->
  <!-- PAINEL 1: HIERARQUIA E ÁRVORE DE PROCESSOS (PID & PPID) -->
  <!-- ======================================================== -->
  <rect x="30" y="80" width="435" height="225" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <text x="46" y="106" class="section-hdr" fill="#1e40af">1. Hierarquia de Processos (PID &amp; PPID)</text>

  <!-- systemd (PID 1) -->
  <rect x="46" y="122" width="140" height="52" rx="6" fill="#1e293b" stroke="#0f172a" />
  <text x="116" y="142" text-anchor="middle" class="code-mono" fill="#38bdf8">systemd (PID 1)</text>
  <text x="116" y="160" text-anchor="middle" font-size="10px" fill="#94a3b8">Ancestral comum de todos</text>

  <!-- Linha conectando PID 1 a sshd -->
  <line x1="186" y1="148" x2="230" y2="148" stroke="#64748b" stroke-width="1.5" />
  <line x1="230" y1="148" x2="230" y2="195" stroke="#64748b" stroke-width="1.5" />
  <line x1="230" y1="148" x2="245" y2="148" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- sshd (PID 480) -->
  <rect x="250" y="122" width="180" height="52" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2" />
  <text x="340" y="142" text-anchor="middle" class="code-mono" fill="#1e40af">sshd (PID 480)</text>
  <text x="340" y="160" text-anchor="middle" class="text-sub">Servidor SSH (PPID: 1)</text>

  <!-- bash (PID 1205) -->
  <rect x="80" y="195" width="160" height="48" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2" />
  <text x="160" y="215" text-anchor="middle" class="code-mono" fill="#15803d">bash (PID 1205)</text>
  <text x="160" y="231" text-anchor="middle" class="text-sub">Seu Terminal (PPID: 480)</text>

  <line x1="240" y1="219" x2="275" y2="219" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- python script.py (PID 3402) -->
  <rect x="280" y="195" width="165" height="48" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.2" />
  <text x="362" y="215" text-anchor="middle" class="code-mono" fill="#854d0e">app.py (PID 3402)</text>
  <text x="362" y="231" text-anchor="middle" class="text-sub">Processo Filho (PPID: 1205)</text>

  <text x="46" y="280" class="text-sub">
    <tspan font-weight="bold">Regra:</tspan> Todo processo nasce via <tspan class="code-mono">fork() + exec()</tspan> a partir de um processo pai (PPID).
  </text>

  <!-- ======================================================== -->
  <!-- PAINEL 2: CONTROLE DE JOBS (FOREGROUND vs BACKGROUND) -->
  <!-- ======================================================== -->
  <rect x="495" y="80" width="435" height="225" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <text x="511" y="106" class="section-hdr" fill="#d97706">2. Controle de Tarefas (Job Control)</text>

  <!-- Foreground Box -->
  <rect x="511" y="122" width="125" height="80" rx="6" fill="#eff6ff" stroke="#2563eb" />
  <text x="573" y="145" text-anchor="middle" font-family="sans-serif" font-size="12px" font-weight="bold" fill="#1e40af">Primeiro Plano</text>
  <text x="573" y="163" text-anchor="middle" class="code-mono" fill="#2563eb">(Foreground)</text>
  <text x="573" y="188" text-anchor="middle" font-size="10px" fill="#475569">Bloqueia o terminal</text>

  <!-- Seta Ctrl+Z -->
  <line x1="636" y1="145" x2="700" y2="145" stroke="#d97706" stroke-width="2" marker-end="url(#arr-amber)" />
  <text x="668" y="137" text-anchor="middle" class="code-mono" font-size="10px" fill="#b45309">Ctrl+Z</text>

  <!-- Stopped / Background Box -->
  <rect x="705" y="122" width="125" height="80" rx="6" fill="#fef3c7" stroke="#f59e0b" />
  <text x="767" y="145" text-anchor="middle" font-family="sans-serif" font-size="12px" font-weight="bold" fill="#92400e">Pausado / Fundo</text>
  <text x="767" y="163" text-anchor="middle" class="code-mono" fill="#b45309">[1]+ Stopped</text>
  <text x="767" y="188" text-anchor="middle" font-size="10px" fill="#92400e">Liberou o prompt</text>

  <!-- Seta bg -> Background ativo -->
  <line x1="767" y1="202" x2="767" y2="222" stroke="#16a34a" stroke-width="1.5" />
  <text x="795" y="216" class="code-mono" font-size="10px" fill="#16a34a">bg</text>

  <!-- Seta fg de volta -->
  <path d="M 705 180 C 670 195, 670 170, 636 175" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-blue)" />
  <text x="668" y="196" text-anchor="middle" class="code-mono" font-size="10px" fill="#1e40af">fg</text>

  <!-- Comandos resumo -->
  <text x="511" y="240" class="code-mono" font-size="11px" fill="#0f172a">comando &amp;  <tspan font-family="sans-serif" font-weight="normal" fill="#64748b">- Inicia direto em segundo plano</tspan></text>
  <text x="511" y="260" class="code-mono" font-size="11px" fill="#0f172a">jobs       <tspan font-family="sans-serif" font-weight="normal" fill="#64748b">- Lista as tarefas ativas na sessão</tspan></text>
  <text x="511" y="280" class="code-mono" font-size="11px" fill="#0f172a">Ctrl + C   <tspan font-family="sans-serif" font-weight="normal" fill="#64748b">- Interrompe o processo ativo (SIGINT)</tspan></text>

  <!-- ======================================================== -->
  <!-- PAINEL 3: SINAIS E ESTADOS DO PROCESSO (SIGNALS) -->
  <!-- ======================================================== -->
  <rect x="30" y="320" width="900" height="195" rx="10" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1" />
  <text x="46" y="346" class="section-hdr" fill="#6b21a8">3. Estados de Processos no top/ps e Principais Sinais de Controle (Signals)</text>

  <!-- Estados no ps (R, S, D, Z, T) -->
  <g transform="translate(46, 360)">
    <rect width="390" height="135" rx="6" fill="#ffffff" stroke="#d8b4fe" />
    <text x="16" y="24" font-family="sans-serif" font-size="12px" font-weight="bold" fill="#581c87">Códigos de Estado (Coluna STAT no ps):</text>
    
    <text x="16" y="48" class="code-mono" fill="#16a34a">R (Running):</text>
    <text x="115" y="48" font-family="sans-serif" font-size="11px" fill="#334155">Executando ou aguardando CPU</text>

    <text x="16" y="70" class="code-mono" fill="#2563eb">S (Interruptible Sleep):</text>
    <text x="190" y="70" font-family="sans-serif" font-size="11px" fill="#334155">Aguardando evento/rede (90% dos processos)</text>

    <text x="16" y="92" class="code-mono" fill="#d97706">T (Stopped):</text>
    <text x="115" y="92" font-family="sans-serif" font-size="11px" fill="#334155">Pausado por sinal ou depurador (Ctrl+Z)</text>

    <text x="16" y="114" class="code-mono" fill="#dc2626">Z (Zombie):</text>
    <text x="115" y="114" font-family="sans-serif" font-size="11px" fill="#334155">Terminou mas o pai não leu o status de saída</text>
  </g>

  <!-- Sinais de Encerramento (kill) -->
  <g transform="translate(465, 360)">
    <rect width="450" height="135" rx="6" fill="#ffffff" stroke="#d8b4fe" />
    <text x="16" y="24" font-family="sans-serif" font-size="12px" font-weight="bold" fill="#581c87">Sinais Mais Utilizados com o comando kill:</text>

    <text x="16" y="48" class="code-mono" fill="#1e40af">SIGTERM (15):</text>
    <text x="125" y="48" font-family="sans-serif" font-size="11px" fill="#334155"><tspan font-weight="bold">Padrão gracioso.</tspan> Pede ao programa para fechar salvando arquivos.</text>

    <text x="16" y="72" class="code-mono" fill="#dc2626">SIGKILL (9):</text>
    <text x="125" y="72" font-family="sans-serif" font-size="11px" fill="#334155"><tspan font-weight="bold">Encerramento forçado.</tspan> O kernel mata na hora; não pode ser ignorado.</text>

    <text x="16" y="96" class="code-mono" fill="#d97706">SIGINT (2):</text>
    <text x="125" y="96" font-family="sans-serif" font-size="11px" fill="#334155">Interrupção do teclado via <tspan class="code-mono">Ctrl + C</tspan>.</text>

    <text x="16" y="118" class="code-mono" fill="#475569">SIGHUP (1):</text>
    <text x="125" y="118" font-family="sans-serif" font-size="11px" fill="#334155">Hangup: usado por daemons (serviços) para <tspan font-weight="bold">recarregar configurações</tspan>.</text>
  </g>

</svg>
