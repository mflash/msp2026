<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 21px; font-weight: 800; fill: #0f172a; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #64748b; }
      .card-title { font-family: system-ui, -apple-system, sans-serif; font-size: 14.5px; font-weight: 700; fill: #ffffff; }
      .card-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; fill: rgba(255,255,255,0.85); }
      .tool-name { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; font-weight: 700; }
      .tool-desc { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; fill: #334155; line-height: 1.35; }
      .badge-txt { font-family: system-ui, -apple-system, sans-serif; font-size: 9.5px; font-weight: 700; }
      .footer-hdr { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; fill: #facc15; }
      .footer-txt { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; fill: #cbd5e1; }
    </style>
  </defs>

  <!-- Fundo Principal -->
  <rect width="1100" height="540" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Cabeçalho -->
  <text x="28" y="38" class="title">Panorama de Profilers por Ecossistema</text>
  <text x="28" y="58" class="subtitle">A ferramenta certa para cada stack, tipo de métrica e tolerância a overhead</text>

  <!-- Pill Header Direita -->
  <rect x="880" y="24" width="195" height="28" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="977" y="42" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5px" font-weight="700" fill="#475569">MÓDULO 05 • GUIA PRÁTICO</text>

  <!-- ========================================================================= -->
  <!-- COLUNA 1: C / C++ / RUST (Largura: 336px)                                  -->
  <!-- ========================================================================= -->
  <g transform="translate(25, 76)">
    <!-- Fundo do Card -->
    <rect width="336" height="342" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
    <!-- Topo Colorido -->
    <rect width="336" height="38" rx="10" fill="#0284c7"/>
    <rect width="336" height="15" y="23" fill="#0284c7"/>
    <text x="14" y="24" class="card-title">C / C++ / Rust</text>
    <text x="322" y="24" text-anchor="end" class="card-sub">Compilado / Nativo</text>

    <!-- Ferramenta 1: perf -->
    <g transform="translate(10, 48)">
      <rect width="316" height="88" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="20" class="tool-name" fill="#0284c7">perf</text>
      <!-- Badges alinhadas à direita -->
      <rect x="150" y="9" width="76" height="15" rx="3" fill="#e0f2fe"/>
      <text x="188" y="20" text-anchor="middle" class="badge-txt" fill="#0369a1">Amostragem</text>
      <rect x="230" y="9" width="76" height="15" rx="3" fill="#dcfce7"/>
      <text x="268" y="20" text-anchor="middle" class="badge-txt" fill="#15803d">Overhead &lt;1%</text>

      <text x="10" y="38" class="tool-desc">Profiling de CPU e contadores de hardware</text>
      <text x="10" y="52" class="tool-desc">via kernel Linux (instruções, cache misses).</text>
      <text x="10" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="10px" font-weight="600" fill="#0284c7">★ Ideal para servidores e produção contínua.</text>
    </g>

    <!-- Ferramenta 2: Callgrind & KCachegrind -->
    <g transform="translate(10, 144)">
      <rect width="316" height="88" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="20" class="tool-name" fill="#0284c7">Callgrind / KCG</text>
      <!-- Badges alinhadas à direita com folga garantida -->
      <rect x="156" y="9" width="70" height="15" rx="3" fill="#fef3c7"/>
      <text x="191" y="20" text-anchor="middle" class="badge-txt" fill="#92400e">Simulação</text>
      <rect x="230" y="9" width="76" height="15" rx="3" fill="#ffedd5"/>
      <text x="268" y="20" text-anchor="middle" class="badge-txt" fill="#c2410c">Overhead 20×</text>

      <text x="10" y="38" class="tool-desc">Contagem exata de instruções e ciclos.</text>
      <text x="10" y="52" class="tool-desc">KCachegrind gera o grafo visual de chamadas.</text>
      <text x="10" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="10px" font-weight="600" fill="#0284c7">★ Cirúrgico para otimizar laços em dev.</text>
    </g>

    <!-- Ferramenta 3: Valgrind Memcheck -->
    <g transform="translate(10, 240)">
      <rect width="316" height="88" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="20" class="tool-name" fill="#0284c7">Valgrind</text>
      <!-- Badges alinhadas à direita -->
      <rect x="144" y="9" width="82" height="15" rx="3" fill="#fee2e2"/>
      <text x="185" y="20" text-anchor="middle" class="badge-txt" fill="#991b1b">Vazamento RAM</text>
      <rect x="230" y="9" width="76" height="15" rx="3" fill="#fee2e2"/>
      <text x="268" y="20" text-anchor="middle" class="badge-txt" fill="#991b1b">Overhead 15×</text>

      <text x="10" y="38" class="tool-desc">Encontra exatamente a linha onde um</text>
      <text x="10" y="52" class="tool-desc"><tspan font-family="monospace" font-size="10px">malloc</tspan> foi chamado sem o <tspan font-family="monospace" font-size="10px">free</tspan> devido.</text>
      <text x="10" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="10px" font-weight="600" fill="#dc2626">★ Caça a bugs de memória e corrupção.</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- COLUNA 2: PYTHON (Largura: 336px)                                         -->
  <!-- ========================================================================= -->
  <g transform="translate(382, 76)">
    <!-- Fundo do Card -->
    <rect width="336" height="342" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
    <!-- Topo Colorido -->
    <rect width="336" height="38" rx="10" fill="#16a34a"/>
    <rect width="336" height="15" y="23" fill="#16a34a"/>
    <text x="14" y="24" class="card-title">Python</text>
    <text x="322" y="24" text-anchor="end" class="card-sub">Interpretado / CPython</text>

    <!-- Ferramenta 1: py-spy -->
    <g transform="translate(10, 48)">
      <rect width="316" height="88" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="20" class="tool-name" fill="#16a34a">py-spy</text>
      <!-- Badges alinhadas à direita -->
      <rect x="150" y="9" width="76" height="15" rx="3" fill="#e0f2fe"/>
      <text x="188" y="20" text-anchor="middle" class="badge-txt" fill="#0369a1">Amostragem</text>
      <rect x="230" y="9" width="76" height="15" rx="3" fill="#dcfce7"/>
      <text x="268" y="20" text-anchor="middle" class="badge-txt" fill="#15803d">Overhead &lt;2%</text>

      <text x="10" y="38" class="tool-desc">Lê a memória do interpretador sem parar</text>
      <text x="10" y="52" class="tool-desc">o código. Gera Flame Graphs interativos em SVG.</text>
      <text x="10" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="10px" font-weight="600" fill="#16a34a">★ Padrão ouro para produção e microsserviços.</text>
    </g>

    <!-- Ferramenta 2: cProfile -->
    <g transform="translate(10, 144)">
      <rect width="316" height="88" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="20" class="tool-name" fill="#16a34a">cProfile</text>
      <!-- Badges alinhadas à direita -->
      <rect x="136" y="9" width="90" height="15" rx="3" fill="#fef3c7"/>
      <text x="181" y="20" text-anchor="middle" class="badge-txt" fill="#92400e">Instrumentação</text>
      <rect x="230" y="9" width="76" height="15" rx="3" fill="#f1f5f9"/>
      <text x="268" y="20" text-anchor="middle" class="badge-txt" fill="#475569">Módulo Nativo</text>

      <text x="10" y="38" class="tool-desc">Embutido na biblioteca padrão do Python.</text>
      <text x="10" y="52" class="tool-desc">Mede <tspan font-family="monospace">tottime</tspan>, <tspan font-family="monospace">cumtime</tspan> e número de chamadas.</text>
      <text x="10" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="10px" font-weight="600" fill="#16a34a">★ Diagnóstico rápido sem instalar nada.</text>
    </g>

    <!-- Ferramenta 3: line_profiler -->
    <g transform="translate(10, 240)">
      <rect width="316" height="88" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="20" class="tool-name" fill="#16a34a">line_profiler</text>
      <!-- Badges alinhadas à direita -->
      <rect x="144" y="9" width="82" height="15" rx="3" fill="#f3e8ff"/>
      <text x="185" y="20" text-anchor="middle" class="badge-txt" fill="#6b21a8">Linha a Linha</text>
      <rect x="230" y="9" width="76" height="15" rx="3" fill="#fee2e2"/>
      <text x="268" y="20" text-anchor="middle" class="badge-txt" fill="#991b1b">Alto Impacto</text>

      <text x="10" y="38" class="tool-desc">Analisa exatamente quanto tempo ou RAM</text>
      <text x="10" y="52" class="tool-desc">cada instrução da função gastou.</text>
      <text x="10" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="10px" font-weight="600" fill="#16a34a">★ Ajuste fino quando o gargalo já é conhecido.</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- COLUNA 3: JAVA / JVM (Largura: 336px)                                     -->
  <!-- ========================================================================= -->
  <g transform="translate(739, 76)">
    <!-- Fundo do Card -->
    <rect width="336" height="342" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
    <!-- Topo Colorido -->
    <rect width="336" height="38" rx="10" fill="#ea580c"/>
    <rect width="336" height="15" y="23" fill="#ea580c"/>
    <text x="14" y="24" class="card-title">Java / JVM</text>
    <text x="322" y="24" text-anchor="end" class="card-sub">HotSpot / OpenJDK</text>

    <!-- Ferramenta 1: JFR & JMC -->
    <g transform="translate(10, 48)">
      <rect width="316" height="88" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="20" class="tool-name" fill="#ea580c">JFR &amp; JMC</text>
      <!-- Badges alinhadas à direita -->
      <rect x="140" y="9" width="86" height="15" rx="3" fill="#e0f2fe"/>
      <text x="183" y="20" text-anchor="middle" class="badge-txt" fill="#0369a1">Nativo HotSpot</text>
      <rect x="230" y="9" width="76" height="15" rx="3" fill="#dcfce7"/>
      <text x="268" y="20" text-anchor="middle" class="badge-txt" fill="#15803d">Overhead &lt;1%</text>

      <text x="10" y="38" class="tool-desc">Flight Recorder embutido no motor da JVM.</text>
      <text x="10" y="52" class="tool-desc">Coleta CPU, pausas de Garbage Collector e threads.</text>
      <text x="10" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="10px" font-weight="600" fill="#ea580c">★ Feito para ficar sempre ativo em produção.</text>
    </g>

    <!-- Ferramenta 2: async-profiler -->
    <g transform="translate(10, 144)">
      <rect width="316" height="88" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="20" class="tool-name" fill="#ea580c">async-profiler</text>
      <!-- Badges alinhadas à direita -->
      <rect x="150" y="9" width="76" height="15" rx="3" fill="#e0f2fe"/>
      <text x="188" y="20" text-anchor="middle" class="badge-txt" fill="#0369a1">Amostragem</text>
      <rect x="230" y="9" width="76" height="15" rx="3" fill="#dcfce7"/>
      <text x="268" y="20" text-anchor="middle" class="badge-txt" fill="#15803d">Sem Bias</text>

      <text x="10" y="38" class="tool-desc">Coleta stack traces sem viés de Safepoint.</text>
      <text x="10" y="52" class="tool-desc">Exporta Flame Graphs diretos de CPU e alocação.</text>
      <text x="10" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="10px" font-weight="600" fill="#ea580c">★ Preferido de engenheiros de backend.</text>
    </g>

    <!-- Ferramenta 3: VisualVM & JConsole -->
    <g transform="translate(10, 240)">
      <rect width="316" height="88" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="20" class="tool-name" fill="#ea580c">VisualVM</text>
      <!-- Badges alinhadas à direita -->
      <rect x="146" y="9" width="78" height="15" rx="3" fill="#fef3c7"/>
      <text x="185" y="20" text-anchor="middle" class="badge-txt" fill="#92400e">GUI / Visual</text>
      <rect x="228" y="9" width="78" height="15" rx="3" fill="#f1f5f9"/>
      <text x="267" y="20" text-anchor="middle" class="badge-txt" fill="#475569">Heap &amp; GC</text>

      <text x="10" y="38" class="tool-desc">Interface gráfica rica para inspeção de memória,</text>
      <text x="10" y="52" class="tool-desc">Heap Dumps e análise de concorrência em tempo real.</text>
      <text x="10" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="10px" font-weight="600" fill="#ea580c">★ Ideal para depurar vazamentos e deadlock.</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- BANNER INFERIOR: REGRA DE OURO DA DECISÃO (Largura: 1050px)               -->
  <!-- ========================================================================= -->
  <g transform="translate(25, 430)">
    <rect width="1050" height="92" rx="10" fill="#0f172a" stroke="#1e293b"/>
    <text x="20" y="23" class="footer-hdr">💡 A REGRA DE OURO DA SELEÇÃO DE PROFILER</text>

    <!-- Ponto 1 -->
    <g transform="translate(20, 36)">
      <rect width="320" height="44" rx="6" fill="#1e293b"/>
      <circle cx="15" cy="22" r="5" fill="#4ade80"/>
      <text x="28" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="11px" font-weight="700" fill="#4ade80">1. Em Produção (Cargas Reais)</text>
      <text x="28" y="33" class="footer-txt">Use Amostragem: <tspan font-family="monospace" fill="#38bdf8">perf</tspan>, <tspan font-family="monospace" fill="#4ade80">py-spy</tspan>, <tspan font-family="monospace" fill="#fb923c">JFR</tspan> (&lt;1% overhead)</text>
    </g>

    <!-- Ponto 2 -->
    <g transform="translate(365, 36)">
      <rect width="320" height="44" rx="6" fill="#1e293b"/>
      <circle cx="15" cy="22" r="5" fill="#facc15"/>
      <text x="28" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="11px" font-weight="700" fill="#facc15">2. Investigação de Gargalos (Dev)</text>
      <text x="28" y="33" class="footer-txt">Use Instrumentação: <tspan font-family="monospace" fill="#38bdf8">Callgrind</tspan>, <tspan font-family="monospace" fill="#4ade80">cProfile</tspan></text>
    </g>

    <!-- Ponto 3 -->
    <g transform="translate(710, 36)">
      <rect width="320" height="44" rx="6" fill="#1e293b"/>
      <circle cx="15" cy="22" r="5" fill="#f87171"/>
      <text x="28" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="11px" font-weight="700" fill="#f87171">3. Vazamento e Corrupção de RAM</text>
      <text x="28" y="33" class="footer-txt">Use Emulação: <tspan font-family="monospace" fill="#f87171">Valgrind</tspan>, <tspan font-family="monospace" fill="#fb923c">VisualVM</tspan></text>
    </g>
  </g>
</svg>
