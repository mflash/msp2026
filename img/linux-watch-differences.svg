  <text x="729.1999999999999" y="116" class="leg-b" style="white-space: pre;">O que o -d faz</text>
  <text x="729.1999999999999" y="134" class="leg" style="white-space: pre;">Compara cada tela com a</text>
  <text x="729.1999999999999" y="152" class="leg" style="white-space: pre;">anterior e realça (vídeo</text>
  <text x="729.1999999999999" y="170" class="leg" style="white-space: pre;">reverso) só os caracteres</text>
  <text x="729.1999999999999" y="188" class="leg" style="white-space: pre;">que mudaram.</text>
  <text x="729.1999999999999" y="224" class="leg-b" style="white-space: pre;">Repare:</text>
  <text x="729.1999999999999" y="242" class="leg" style="white-space: pre;">• used subiu: 3.4 → 3.8</text>
  <text x="729.1999999999999" y="260" class="leg" style="white-space: pre;">• free caiu: 2.1 → 1.7</text>
  <text x="729.1999999999999" y="278" class="leg" style="white-space: pre;">• available caiu: 4.0 → 3.6</text>
  <text x="729.1999999999999" y="296" class="leg" style="white-space: pre;">• total, shared e Swap não</text>
  <text x="729.1999999999999" y="314" class="leg" style="white-space: pre;">  mudaram: sem realce.</text>
  <text x="729.1999999999999" y="332" class="leg" style="white-space: pre;">• O relógio do cabeçalho</text>
  <text x="729.1999999999999" y="350" class="leg" style="white-space: pre;">  muda, mas não é realçado.</text>
  <rect x="40" y="400" width="890" height="96" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="56" y="424" class="lbl" fill="#334155">Variações úteis</text>
  <text x="56" y="448" class="cmd" style="white-space: pre;">watch --differences=permanent free -h</text>
  <text x="340" y="448" class="tip" style="white-space: pre;">mantém realçado tudo o que já mudou desde o início (bom para notar oscilações raras)</text>
  <text x="56" y="472" class="cmd" style="white-space: pre;">watch -n 2 -d 'cmd | cmd'</text>
  <text x="340" y="472" class="tip" style="white-space: pre;">com pipes, coloque o comando entre aspas; -n define o intervalo em segundos</text>
</svg>
