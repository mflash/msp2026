<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #1e293b; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #64748b; }
      .section-hdr { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; }
      .box-label { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; }
      .text-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #64748b; }
      .code-mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; font-weight: 700; }
      .code-sm { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
      .flame-txt { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 600; fill: #ffffff; text-anchor: middle; }
    </style>
  </defs>
  <rect width="960" height="540" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="32" y="40" class="title" style="white-space: pre;">Ecossistema de Profiling e Anatomia de um Flame Graph</text>
  <text x="32" y="60" class="subtitle" style="white-space: pre;">Identificando gargalos de CPU e memória em aplicações C, Python e Java</text>
  <rect x="30" y="80" width="540" height="225" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="46" y="106" class="section-hdr" fill="#c2410c" style="white-space: pre;">1. Anatomia de um Flame Graph (Gráfico de Chama)</text>
  <rect x="50" y="230" width="490" height="28" rx="4" fill="#ea580c" stroke="#c2410c"/>
  <text x="295" y="248" class="flame-txt" style="white-space: pre;">main() [100%]</text>
  <rect x="50" y="196" width="147" height="28" rx="4" fill="#fb923c" stroke="#f97316"/>
  <text x="123.5" y="214" class="flame-txt" style="white-space: pre;">init_database() [30%]</text>
  <rect x="200" y="196" width="318" height="28" rx="4" fill="#f97316" stroke="#ea580c"/>
  <text x="359" y="214" class="flame-txt" style="white-space: pre;">process_requests() [65%]</text>
  <rect x="200" y="162" width="220" height="28" rx="4" fill="#f59e0b" stroke="#d97706"/>
  <text x="310" y="180" class="flame-txt" style="white-space: pre;">parse_json() [45%]</text>
  <rect x="425" y="162" width="88" height="28" rx="4" fill="#fbbf24" stroke="#f59e0b"/>
  <text x="469" y="180" class="flame-txt" fill="#78350f" style="white-space: pre;">send() [18%]</text>
  <rect x="200" y="128" width="186" height="28" rx="4" fill="#e11d48" stroke="#be123c"/>
  <text x="293" y="146" class="flame-txt" style="white-space: pre;">regex_match() [38%]</text>
  <text x="394" y="146" font-family="sans-serif" font-size="11px" font-weight="bold" fill="#be123c" style="white-space: pre;">← topo livre: gargalo real!</text>
  <text x="50" y="276" class="text-sub" style="white-space: pre;"><tspan font-weight="bold">Como ler:</tspan> eixo <tspan font-weight="bold">X</tspan> = proporção do tempo de CPU (ordem alfabética, não cronológica);</text>
  <text x="50" y="291" class="text-sub" style="white-space: pre;">eixo <tspan font-weight="bold">Y</tspan> = pilha de chamadas. O gargalo é o bloco largo <tspan font-weight="bold">sem nada empilhado acima</tspan>.</text>
  <rect x="600" y="80" width="330" height="225" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="616" y="106" class="section-hdr" fill="#1e40af" style="white-space: pre;">2. Abordagens de Profiling</text>
  <rect x="616" y="118" width="298" height="54" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="628" y="134" font-family="sans-serif" font-size="12px" font-weight="bold" fill="#1e40af" style="white-space: pre;">Amostragem (Sampling - Baixo Overhead)</text>
  <text x="628" y="149" font-family="sans-serif" font-size="11px" fill="#334155" style="white-space: pre;">Coleta a pilha centenas de vezes por segundo.</text>
  <text x="628" y="164" class="code-mono" font-size="10px" fill="#2563eb" style="white-space: pre;">Ex.: perf, py-spy, async-profiler</text>
  <rect x="616" y="178" width="298" height="54" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="628" y="194" font-family="sans-serif" font-size="12px" font-weight="bold" fill="#991b1b" style="white-space: pre;">Instrumentação (Tracing - Alto Overhead)</text>
  <text x="628" y="209" font-family="sans-serif" font-size="11px" fill="#334155" style="white-space: pre;">Contadores em cada entrada/saída de função.</text>
  <text x="628" y="224" class="code-mono" font-size="10px" fill="#dc2626" style="white-space: pre;">Ex.: cProfile, line_profiler</text>
  <rect x="616" y="238" width="298" height="54" rx="6" fill="#fefce8" stroke="#fde047"/>
  <text x="628" y="254" font-family="sans-serif" font-size="12px" font-weight="bold" fill="#854d0e" style="white-space: pre;">Emulação (Overhead Muito Alto)</text>
  <text x="628" y="269" font-family="sans-serif" font-size="11px" fill="#334155" style="white-space: pre;">CPU virtual traduz e instrumenta cada instrução.</text>
  <text x="628" y="284" class="code-mono" font-size="10px" fill="#a16207" style="white-space: pre;">Ex.: Valgrind (Memcheck, Callgrind)</text>
  <rect x="30" y="320" width="900" height="195" rx="10" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="46" y="346" class="section-hdr" fill="#6b21a8" style="white-space: pre;">3. Ferramentas Gratuitas e de Código Aberto por Ecossistema</text>
  <g transform="translate(46, 360)">
    <rect width="270" height="135" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <rect width="270" height="28" rx="6" fill="#0284c7"/>
    <text x="135" y="19" text-anchor="middle" font-family="sans-serif" font-size="12px" font-weight="bold" fill="#ffffff" style="white-space: pre;">C / C++</text>
    <text x="14" y="50" class="code-mono" fill="#0284c7" style="white-space: pre;">perf</text>
    <text x="50" y="50" font-family="sans-serif" font-size="11px" fill="#334155" style="white-space: pre;">: Profiler nativo do Linux kernel</text>
    <text x="14" y="74" class="code-mono" fill="#0284c7" style="white-space: pre;">Valgrind</text>
    <text x="75" y="74" font-family="sans-serif" font-size="11px" fill="#334155" style="white-space: pre;">: Detecção de vazamento de memória</text>
    <text x="14" y="98" class="code-mono" fill="#0284c7" style="white-space: pre;">gprof</text>
    <text x="55" y="98" font-family="sans-serif" font-size="11px" fill="#334155" style="white-space: pre;">: Análise de chamadas do GCC</text>
    <text x="14" y="122" class="code-mono" fill="#0284c7" style="white-space: pre;">Callgrind</text>
    <text x="80" y="122" font-family="sans-serif" font-size="11px" fill="#334155" style="white-space: pre;">: Mapeamento de grafos de função</text>
  </g>
  <g transform="translate(345, 360)">
    <rect width="270" height="135" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <rect width="270" height="28" rx="6" fill="#16a34a"/>
    <text x="135" y="19" text-anchor="middle" font-family="sans-serif" font-size="12px" font-weight="bold" fill="#ffffff" style="white-space: pre;">Python</text>
    <text x="14" y="50" class="code-mono" fill="#16a34a" style="white-space: pre;">cProfile</text>
    <text x="75" y="50" font-family="sans-serif" font-size="11px" fill="#334155" style="white-space: pre; font-size: 11px;">: Embutido na biblioteca padrão</text>
    <text x="14" y="74" class="code-mono" fill="#16a34a" style="white-space: pre;">py-spy</text>
    <text x="62" y="74" font-family="sans-serif" font-size="11px" fill="#334155" style="white-space: pre; font-size: 11px;">: Sampling sem reiniciar o app</text>
    <text x="14" y="98" class="code-mono" fill="#16a34a" style="white-space: pre;">memory_profiler</text>
    <text x="125" y="98" font-family="sans-serif" font-size="11px" fill="#334155" style="white-space: pre;">: RAM linha a linha</text>
    <text x="14" y="122" class="code-mono" fill="#16a34a" style="white-space: pre;">line_profiler</text>
    <text x="110" y="122" font-family="sans-serif" font-size="11px" fill="#334155" style="white-space: pre; font-size: 11px;">: Tempo linha a linha</text>
  </g>
  <g transform="translate(645, 360)">
    <rect width="270" height="135" fill="#ffffff" stroke="#cbd5e1" rx="6"/>
    <rect width="270" height="28" rx="6" fill="#b45309"/>
    <text x="135" y="19" text-anchor="middle" font-family="sans-serif" font-size="12px" font-weight="bold" fill="#ffffff" style="white-space: pre;">Java / JVM</text>
    <text x="14" y="50" class="code-mono" fill="#b45309" style="white-space: pre;">JFR &amp; JMC</text>
    <text style="fill: rgb(51, 65, 85); font-size: 10px; white-space: pre;" x="91" y="50">: Flight Recorder nativo (&lt;1% overhead)</text>
    <text x="14" y="74" class="code-mono" fill="#b45309" style="white-space: pre;">async-profiler</text>
    <text style="fill: rgb(51, 65, 85); font-size: 10px; white-space: pre;" x="114" y="74">: Flame Graphs sem safepoint bias</text>
    <text x="14" y="98" class="code-mono" fill="#b45309" style="white-space: pre;">VisualVM</text>
    <text style="fill: rgb(51, 65, 85); font-size: 10px; white-space: pre;" x="114" y="98">: Interface visual para Heap e CPU</text>
    <text x="14" y="122" class="code-mono" fill="#b45309" style="white-space: pre;">jcmd / jstat</text>
    <text style="fill: rgb(51, 65, 85); font-size: 10px; white-space: pre;" x="112" y="122">: Comandos CLI embutidos no JDK</text>
  </g>
</svg>