<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <rect width="960" height="540" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="32" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="20px" font-weight="700" fill="#1e293b">Merge com Conflito: as Duas Branches Alteraram a Mesma Linha</text>
  <text x="32" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="13px" fill="#64748b">Mesmo histórico do merge sem conflito: só muda o que cada commit alterou no arquivo config.h</text>
  <rect x="30" y="78" width="900" height="172" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <line x1="110" y1="200" x2="455" y2="200" stroke="#2563eb" stroke-width="4"/>
  <path d="M 230 200 C 300 200 300 125 380 125" fill="none" stroke="#16a34a" stroke-width="4"/>
  <line x1="380" y1="125" x2="530" y2="125" stroke="#16a34a" stroke-width="4"/>
  
  <text x="84" y="205" text-anchor="end" font-family="Consolas, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13px" font-weight="700" fill="#1e40af">main</text>
  <text x="455" y="104" text-anchor="middle" font-family="Consolas, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13px" font-weight="700" fill="#166534">feature/login</text>
  <circle cx="110" cy="200" r="16" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
  <text x="110" y="204" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11px" font-weight="700" fill="#ffffff">C1</text>
  <circle cx="230" cy="200" r="16" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
  <text x="230" y="204" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11px" font-weight="700" fill="#ffffff">C2</text>
  <circle cx="455" cy="200" r="22" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="4 3"/>
  <circle cx="455" cy="200" r="16" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
  <text x="455" y="204" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11px" font-weight="700" fill="#ffffff">C3</text>
  <circle cx="380" cy="125" r="16" fill="#16a34a" stroke="#166534" stroke-width="2"/>
  <text x="380" y="129" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11px" font-weight="700" fill="#ffffff">F1</text>
  <circle cx="530" cy="125" r="22" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="4 3"/>
  <circle cx="530" cy="125" r="16" fill="#16a34a" stroke="#166534" stroke-width="2"/>
  <text x="530" y="129" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11px" font-weight="700" fill="#ffffff">F2</text>
  <line x1="477" y1="200" x2="681" y2="200" stroke="#2563eb" stroke-width="4" stroke-dasharray="8 6"/>
  <path d="M 552 125 C 620 125 620 200 681 200" fill="none" stroke="#16a34a" stroke-width="4" stroke-dasharray="8 6"/>
  <circle cx="700" cy="200" r="19" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="5 3"/>
  <text x="700" y="204" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11px" font-weight="700" fill="#991b1b">M1?</text>
  <text x="700" y="166" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5px" fill="#991b1b">só é criado após</text>
  <text x="700" y="178" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5px" fill="#991b1b">a resolução</text>
  <text x="700" y="238" text-anchor="middle" font-family="Consolas, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px" font-weight="700" fill="#991b1b">git merge feature/login</text>
  <text x="230" y="238" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#64748b">ponto em que a branch foi criada</text>
  <rect x="752" y="138" width="164" height="70" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="834" y="160" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13px" font-weight="700" fill="#991b1b">✖  CONFLITO</text>
  <text x="834" y="178" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#334155">o merge é pausado e</text>
  <text x="834" y="194" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#334155">aguarda uma decisão humana</text>
  <rect x="30" y="264" width="290" height="182" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/>
  <text x="44" y="286" font-family="system-ui, -apple-system, sans-serif" font-size="12.5px" font-weight="700" fill="#2563eb">C3 (na main) alterou:</text>
  <rect x="42" y="296" width="266" height="138" rx="6" fill="#0f172a"/>
  <rect x="46" y="304" width="258" height="16" rx="2" fill="#7f1d1d"/>
  <text x="52" y="316" font-family="Consolas, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px" font-weight="400" fill="#fecaca" style="white-space: pre;">- #define PORTA_SERVIDOR 80</text>
  <rect x="46" y="321" width="258" height="16" rx="2" fill="#14532d"/>
  <text x="52" y="333" font-family="Consolas, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px" font-weight="400" fill="#bbf7d0" style="white-space: pre;">+ #define PORTA_SERVIDOR 8080</text>
  <text x="52" y="350" font-family="Consolas, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px" font-weight="400" fill="#cbd5e1" style="white-space: pre;">  #define TIMEOUT_SEG    30</text>
  <text x="52" y="367" font-family="Consolas, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px" font-weight="400" fill="#cbd5e1" style="white-space: pre;">  #define MAX_CONEXOES   100</text>
  <rect x="335" y="264" width="290" height="182" rx="10" fill="#f8fafc" stroke="#16a34a" stroke-width="1.5"/>
  <text x="349" y="286" font-family="system-ui, -apple-system, sans-serif" font-size="12.5px" font-weight="700" fill="#16a34a">F2 (na feature/login) alterou:</text>
  <rect x="347" y="296" width="266" height="138" rx="6" fill="#0f172a"/>
  <rect x="351" y="304" width="258" height="16" rx="2" fill="#7f1d1d"/>
  <text x="357" y="316" font-family="Consolas, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px" font-weight="400" fill="#fecaca" style="white-space: pre;">- #define PORTA_SERVIDOR 80</text>
  <rect x="351" y="321" width="258" height="16" rx="2" fill="#14532d"/>
  <text x="357" y="333" font-family="Consolas, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px" font-weight="400" fill="#bbf7d0" style="white-space: pre;">+ #define PORTA_SERVIDOR 9000</text>
  <text x="357" y="350" font-family="Consolas, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px" font-weight="400" fill="#cbd5e1" style="white-space: pre;">  #define TIMEOUT_SEG    30</text>
  <text x="357" y="367" font-family="Consolas, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px" font-weight="400" fill="#cbd5e1" style="white-space: pre;">  #define MAX_CONEXOES   100</text>
  <rect x="640" y="264" width="290" height="182" rx="10" fill="#f8fafc" stroke="#dc2626" stroke-width="1.5"/>
  <text x="654" y="286" font-family="system-ui, -apple-system, sans-serif" font-size="12.5px" font-weight="700" fill="#dc2626">Resultado em config.h: conflito!</text>
  <rect x="652" y="296" width="266" height="138" rx="6" fill="#0f172a"/>
  <text x="662" y="316" font-family="Consolas, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px" font-weight="700" fill="#fbbf24" style="white-space: pre;">&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD</text>
  <rect x="656" y="321" width="258" height="16" rx="2" fill="#1e3a8a"/>
  <text x="662" y="333" font-family="Consolas, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px" font-weight="400" fill="#dbeafe" style="white-space: pre;">#define PORTA_SERVIDOR 8080</text>
  <text x="662" y="350" font-family="Consolas, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px" font-weight="700" fill="#fbbf24" style="white-space: pre;">=======</text>
  <rect x="656" y="355" width="258" height="16" rx="2" fill="#14532d"/>
  <text x="662" y="367" font-family="Consolas, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px" font-weight="400" fill="#bbf7d0" style="white-space: pre;">#define PORTA_SERVIDOR 9000</text>
  <text x="662" y="384" font-family="Consolas, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px" font-weight="700" fill="#fbbf24" style="white-space: pre;">&gt;&gt;&gt;&gt;&gt;&gt;&gt; feature/login</text>
  <text x="662" y="401" font-family="Consolas, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px" font-weight="400" fill="#cbd5e1" style="white-space: pre;">#define TIMEOUT_SEG    30</text>
  <text x="662" y="418" font-family="Consolas, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px" font-weight="400" fill="#cbd5e1" style="white-space: pre;">#define MAX_CONEXOES   100</text>
  <rect x="30" y="460" width="900" height="62" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text x="46" y="485" font-family="system-ui, -apple-system, sans-serif" font-size="12px" fill="#334155"><tspan font-weight="700">Por que houve conflito?</tspan> C3 e F2 alteraram a <tspan font-weight="700">mesma linha</tspan> de formas diferentes, e o Git não tem como saber qual versão é a correta.</text>
  <text x="46" y="507" font-family="system-ui, -apple-system, sans-serif" font-size="12px" fill="#334155">Resolução: edite o arquivo, mantenha o código certo e apague os marcadores → <tspan font-family="Consolas, ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700">git add config.h</tspan> → <tspan font-family="Consolas, ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700">git commit</tspan>  (ou <tspan font-family="Consolas, ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700">git merge --abort</tspan> para desistir).</text>
</svg>
